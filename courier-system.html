<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parcelo – Courier management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f2fb;--card:#fff;--text:#1f1d3a;--muted:#6f6d8c;--line:#e6e4f3;--side:#1c1b3a;--violet:#6d4aff;--teal:#0f9d8a;--coral:#f2603f;--amber:#e9a31c;--sky:#2b8cd6;--grey:#7b7a93;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13122a;--card:#1e1d3d;--text:#ecebff;--muted:#a3a1c4;--line:#323060;--side:#0c0b1d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13122a;--card:#1e1d3d;--text:#ecebff;--muted:#a3a1c4;--line:#323060;--side:#0c0b1d;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:190px 1fr;min-height:100vh}
aside{background:var(--side);color:#fff;padding:16px 0;position:sticky;top:0;height:100vh;overflow:auto}
.burger{display:block;margin:0 0 14px 24px;width:34px;height:30px;border:0;border-radius:4px;background:var(--violet);color:#fff;font-size:18px;cursor:pointer}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;padding:14px 8px;background:none;border:0;border-left:3px solid transparent;color:#d7d5f2;font-weight:700;font-size:13px;cursor:pointer}
nav button i{font-style:normal;font-size:20px}
nav button:hover{background:rgba(255,255,255,.06)}
nav button.on{background:rgba(109,74,255,.25);border-left-color:var(--violet);color:#fff}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
header{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:12px 28px;position:sticky;top:0;z-index:5}
.logo{font-size:30px;font-weight:800;color:var(--violet);letter-spacing:-1px;margin-right:6px}
.search{display:flex;border:2px solid var(--line);border-radius:3px;background:var(--bg);flex:0 1 260px}
.search input{border:0;background:none;padding:7px 10px;width:100%;min-width:0}
.search span{padding:6px 10px;color:var(--teal)}
.sp{flex:1}
.ico{position:relative;font-size:18px;color:var(--muted);background:none;border:0;cursor:pointer}
.ico b{position:absolute;top:-6px;right:-8px;background:var(--coral);color:#fff;border-radius:50%;font-size:10px;width:16px;height:16px;display:grid;place-items:center}
.me{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-weight:800;border:2px solid var(--line)}
.me strong{color:var(--coral);display:block;line-height:1.2}
.me small{color:var(--muted);font-style:italic}
main{padding:28px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;margin-bottom:26px}
.stat{color:#fff;padding:24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.stat .n{font-size:42px;font-weight:500;line-height:1}
.stat h3{margin:4px 0 6px;font-size:18px;font-weight:500}
.stat small{font-size:12px;font-weight:700}
.stat .c{width:74px;height:74px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:32px;flex:none}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:24px}
.panel{background:var(--card);border:1px solid var(--line);padding:18px 18px 8px;min-width:0}
.panel h2{margin:0 0 10px;font-size:18px;text-transform:uppercase;color:var(--muted);font-weight:800}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);font-weight:800}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
.badge{display:inline-block;padding:1px 8px;border-radius:3px;color:#fff;font-size:12px;font-weight:800}
.pill{display:inline-block;min-width:44px;text-align:center;padding:1px 8px;border-radius:10px;background:var(--grey);color:#fff;font-size:12px;font-weight:800}
.s-Pending{background:var(--grey)}.s-Picked-up{background:var(--sky)}.s-In-transit{background:var(--amber)}.s-Out-for-delivery{background:var(--violet)}.s-Delivered{background:var(--teal)}.s-Cancelled{background:var(--coral)}
.bar{display:grid;grid-template-columns:90px 1fr 28px;gap:10px;align-items:center;margin:0 0 14px}
.bar div{height:14px;background:var(--bg);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--violet)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn{border:0;border-radius:3px;padding:8px 14px;background:var(--violet);color:#fff;font-weight:700;cursor:pointer}
.btn.alt{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.del{background:none;color:var(--coral);padding:2px 8px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:8px 10px}
td select{padding:3px 6px}
.cour{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.cc{background:var(--card);border:1px solid var(--line);padding:18px;border-top:4px solid var(--teal)}
.cc.off{border-top-color:var(--grey);opacity:.75}
.cc h3{margin:0}.cc p{margin:2px 0 10px;color:var(--muted)}
.tl{list-style:none;margin:16px 0 10px;padding:0 0 0 18px;border-left:3px solid var(--line)}
.tl li{position:relative;padding:0 0 16px 14px}
.tl li:before{content:"";position:absolute;left:-26px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--violet)}
.tl small{color:var(--muted);display:block}
dialog{border:0;border-radius:4px;padding:22px;width:min(420px,92vw);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(10,9,30,.55)}
dialog label{display:block;font-weight:700;margin:10px 0 3px}
dialog input,dialog select{width:100%}
textarea{width:100%;height:300px;font:12px/1.4 ui-monospace,Menlo,monospace}
.empty{padding:26px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--side);color:#fff;padding:9px 18px;border-radius:4px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (max-width:860px){
.app{grid-template-columns:1fr}
aside{position:fixed;left:0;top:0;width:190px;z-index:30;transform:translateX(-100%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
aside.open{transform:none}
.grid2{grid-template-columns:1fr}
header{padding:10px 14px;gap:12px}.search{flex:1}.me div,.logo{display:none}
main{padding:16px}
}
@media (min-width:861px){.mb{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside id="side"><button class="burger" id="burger" aria-label="Menu">☰</button><nav id="nav"></nav></aside>
<div>
<header>
<button class="ico mb" id="mb" aria-label="Open menu">☰</button>
<span class="logo">Parcelo</span>
<label class="search"><input id="q" placeholder="Search shipments…" aria-label="Search shipments"><span>⌕</span></label>
<span class="sp"></span>
<button class="ico" id="theme" aria-label="Toggle theme">◐</button>
<span class="ico" title="Active shipments">✉<b id="bA">0</b></span>
<div class="me"><div class="av">AK</div><div><strong>Amira Khan</strong><small>Dispatcher</small></div></div>
</header>
<main id="view"></main>
</div>
</div>

<dialog id="dlg">
<h2 style="margin:0 0 6px">New shipment</h2>
<label for="fS">Sender</label><input id="fS">
<label for="fR">Receiver</label><input id="fR">
<label for="fC">Destination city</label><input id="fC">
<label for="fK">Courier</label><select id="fK"></select>
<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px">
<button class="btn alt" id="fX">Cancel</button><button class="btn" id="fOk">Create shipment</button></div>
</dialog>
<div class="toast" id="toast"></div>

<script type="application/json" id="seed">
{"couriers":[
{"id":"C1","name":"Hamza Ali","zone":"North","phone":"+44 20 5550 101","active":true},
{"id":"C2","name":"Lena Fischer","zone":"Central","phone":"+49 30 5550 102","active":true},
{"id":"C3","name":"Omar Haddad","zone":"Gulf","phone":"+971 4 555 0103","active":true},
{"id":"C4","name":"Maya Chen","zone":"West","phone":"+1 416 555 0104","active":false}],
"shipments":[
{"id":"PCL-1001","sender":"Northwind Books","receiver":"Ella Moore","city":"London","courier":"C1","status":"Delivered","created":"2026-10-10","history":[["Pending","2026-10-10"],["Picked up","2026-10-10"],["In transit","2026-10-11"],["Delivered","2026-10-12"]]},
{"id":"PCL-1002","sender":"Brightside Tech","receiver":"Jonas Weber","city":"Berlin","courier":"C2","status":"In transit","created":"2026-10-14","history":[["Pending","2026-10-14"],["Picked up","2026-10-15"],["In transit","2026-10-16"]]},
{"id":"PCL-1003","sender":"Desert Rose Co.","receiver":"Salma Nasser","city":"Dubai","courier":"C3","status":"Out for delivery","created":"2026-10-15","history":[["Pending","2026-10-15"],["Picked up","2026-10-15"],["In transit","2026-10-16"],["Out for delivery","2026-10-18"]]},
{"id":"PCL-1004","sender":"Maple Goods","receiver":"Noah Tremblay","city":"Toronto","courier":"C4","status":"Pending","created":"2026-10-17","history":[["Pending","2026-10-17"]]},
{"id":"PCL-1005","sender":"Casa Verde","receiver":"Lucía Ramos","city":"Madrid","courier":"C2","status":"Picked up","created":"2026-10-17","history":[["Pending","2026-10-17"],["Picked up","2026-10-18"]]},
{"id":"PCL-1006","sender":"Northwind Books","receiver":"Tom Hughes","city":"London","courier":"C1","status":"Delivered","created":"2026-10-08","history":[["Pending","2026-10-08"],["Picked up","2026-10-08"],["In transit","2026-10-09"],["Delivered","2026-10-10"]]},
{"id":"PCL-1007","sender":"Brightside Tech","receiver":"Mira Schulz","city":"Berlin","courier":"C2","status":"Cancelled","created":"2026-10-12","history":[["Pending","2026-10-12"],["Cancelled","2026-10-13"]]},
{"id":"PCL-1008","sender":"Desert Rose Co.","receiver":"Yusuf Karim","city":"Dubai","courier":"C3","status":"In transit","created":"2026-10-16","history":[["Pending","2026-10-16"],["Picked up","2026-10-16"],["In transit","2026-10-17"]]}]}
</script>

<script>
const ST={"Pending":10,"Picked up":35,"In transit":65,"Out for delivery":85,"Delivered":100,"Cancelled":0};
const NAV=[["dash","▣","Dashboard"],["ship","▤","Shipments"],["cour","➤","Couriers"],["track","⌖","Track"],["data","{ }","Data"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cls=s=>"s-"+s.replace(/ /g,"-");
const today=()=>new Date().toISOString().slice(0,10);
let db,view="dash",filter="All",trackId="";
try{db=JSON.parse(localStorage.getItem("parcelo-db"))}catch(e){}
if(!db||!db.shipments||!db.couriers)db=JSON.parse($("#seed").textContent);
const save=()=>{try{localStorage.setItem("parcelo-db",JSON.stringify(db))}catch(e){}};
const cname=id=>(db.couriers.find(c=>c.id===id)||{name:"Unassigned"}).name;
const badge=s=>`<span class="badge ${cls(s)}">${s}</span>`;
const pill=s=>`<span class="pill">${ST[s]}%</span>`;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2000)}
function nav(){$("#nav").innerHTML=NAV.map(n=>`<button data-v="${n[0]}" class="${view===n[0]?"on":""}"><i>${n[1]}</i>${n[2]}</button>`).join("")}
function go(v){view=v;$("#side").classList.remove("open");render()}
function rows(list,full){
 if(!list.length)return `<div class="empty">No shipments match. Clear the search or create a new shipment.</div>`;
 return `<div class="wrap"><table><tr><th>ID</th><th>Receiver</th><th>City</th><th>Courier</th><th>Status</th>${full?"<th>Update</th>":"<th>Progress</th>"}</tr>`+
 list.map(s=>`<tr><td>${s.id}</td><td>${esc(s.receiver)}</td><td>${esc(s.city)}</td><td>${esc(cname(s.courier))}</td><td>${badge(s.status)}</td>`+
 (full?`<td><select data-id="${s.id}" class="st" aria-label="Status of ${s.id}">${Object.keys(ST).map(k=>`<option${k===s.status?" selected":""}>${k}</option>`).join("")}</select> <button class="btn del" data-del="${s.id}" aria-label="Delete ${s.id}">✕</button></td>`:`<td>${pill(s.status)}</td>`)+`</tr>`).join("")+`</table></div>`}
function dash(){
 const S=db.shipments,n=f=>S.filter(f).length;
 const act=n(s=>!["Delivered","Cancelled"].includes(s.status));
 const cities={};S.forEach(s=>cities[s.city]=(cities[s.city]||0)+1);
 const max=Math.max(1,...Object.values(cities));
 const card=(c,num,t,sub,ic)=>`<div class="stat" style="background:${c}"><div><div class="n">${num}</div><h3>${t}</h3><small>${sub}</small></div><div class="c" style="color:${c}">${ic}</div></div>`;
 return `<div class="stats">
 ${card("var(--violet)",S.length,"Total shipments","All time","▤")}
 ${card("var(--teal)",n(s=>s.status==="Delivered"),"Delivered","Completed successfully","✓")}
 ${card("#d9532f",act,"On the move","Awaiting delivery","➤")}
 ${card("#2579b8",db.couriers.filter(c=>c.active).length,"Active couriers",`${db.couriers.length} on the team`,"☺")}</div>
 <div class="grid2"><div class="panel"><h2>Recent shipments</h2>${rows(S.slice().sort((a,b)=>b.id.localeCompare(a.id)).slice(0,6),false)}</div>
 <div class="panel"><h2>Deliveries by city</h2><div style="padding-top:6px">${Object.entries(cities).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="bar"><span>${esc(c)}</span><div><i style="width:${v/max*100}%"></i></div><b>${v}</b></div>`).join("")}</div></div></div>`}
function ship(){
 const q=$("#q").value.trim().toLowerCase();
 const list=db.shipments.filter(s=>(filter==="All"||s.status===filter)&&(!q||[s.id,s.sender,s.receiver,s.city].join(" ").toLowerCase().includes(q)));
 return `<div class="tools"><button class="btn" id="add">+ New shipment</button><select id="flt" aria-label="Filter by status">${["All",...Object.keys(ST)].map(k=>`<option${k===filter?" selected":""}>${k}</option>`).join("")}</select></div><div class="panel"><h2>Shipments (${list.length})</h2>${rows(list,true)}</div>`}
function cour(){
 return `<div class="cour">`+db.couriers.map(c=>{const m=db.shipments.filter(s=>s.courier===c.id),a=m.filter(s=>!["Delivered","Cancelled"].includes(s.status)).length;
 return `<div class="cc ${c.active?"":"off"}"><h3>${esc(c.name)}</h3><p>${esc(c.zone)} zone · ${esc(c.phone)}</p><p><b>${a}</b> active · <b>${m.length}</b> total</p><button class="btn alt" data-tg="${c.id}">${c.active?"Set off duty":"Set on duty"}</button></div>`}).join("")+`</div>`}
function track(){
 const s=db.shipments.find(x=>x.id.toLowerCase()===trackId.toLowerCase());
 let out=`<div class="panel" style="max-width:640px"><h2>Track a shipment</h2><div class="tools"><input id="tid" placeholder="e.g. PCL-1002" value="${esc(trackId)}" aria-label="Shipment ID"><button class="btn" id="go">Track shipment</button></div>`;
 if(trackId&&!s)out+=`<div class="empty">No shipment found with ID “${esc(trackId)}”. Check the ID and try again.</div>`;
 if(s)out+=`<h3 style="margin:6px 0">${s.id} ${badge(s.status)}</h3><p style="color:var(--muted);margin:0">${esc(s.sender)} → ${esc(s.receiver)}, ${esc(s.city)} · Courier: ${esc(cname(s.courier))}</p><ul class="tl">${s.history.slice().reverse().map(h=>`<li><b>${h[0]}</b><small>${h[1]}</small></li>`).join("")}</ul>`;
 return out+`</div>`}
function data(){
 return `<div class="panel" style="padding-bottom:18px"><h2>Data (JSON)</h2><p style="color:var(--muted)">Your shipments and couriers are stored as JSON in this browser. Copy it to back up, or paste JSON and apply it to restore.</p><textarea id="js" spellcheck="false">${esc(JSON.stringify(db,null,1))}</textarea><div class="tools" style="margin:12px 0 0"><button class="btn" id="cp">Copy JSON</button><button class="btn alt" id="ap">Apply JSON</button><button class="btn alt" id="rs">Reset to sample data</button></div></div>`}
function render(){
 nav();$("#view").innerHTML={dash,ship,cour,track,data}[view]();
 $("#bA").textContent=db.shipments.filter(s=>!["Delivered","Cancelled"].includes(s.status)).length}
function setStatus(id,st){const s=db.shipments.find(x=>x.id===id);s.status=st;s.history.push([st,today()]);save();render();toast(id+" updated to "+st)}

$("#nav").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.v)};
$("#burger").onclick=$("#mb").onclick=()=>$("#side").classList.toggle("open");
$("#q").oninput=()=>{if(view!=="ship"){view="ship"}render();const i=$("#q");}
$("#theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"};
$("#view").onclick=e=>{
 const t=e.target;
 if(t.id==="add"){$("#fK").innerHTML=db.couriers.filter(c=>c.active).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");["fS","fR","fC"].forEach(i=>$("#"+i).value="");$("#dlg").showModal()}
 if(t.dataset.del&&confirm("Delete "+t.dataset.del+"?")){db.shipments=db.shipments.filter(s=>s.id!==t.dataset.del);save();render();toast("Shipment deleted")}
 if(t.dataset.tg){const c=db.couriers.find(x=>x.id===t.dataset.tg);c.active=!c.active;save();render()}
 if(t.id==="go"){trackId=$("#tid").value.trim();render()}
 if(t.id==="cp"){const x=$("#js");x.select();try{navigator.clipboard.writeText(x.value);toast("JSON copied")}catch(_){document.execCommand&&document.execCommand("copy");toast("JSON copied")}}
 if(t.id==="ap"){try{const o=JSON.parse($("#js").value);if(!Array.isArray(o.shipments)||!Array.isArray(o.couriers))throw 0;db=o;save();render();toast("JSON applied")}catch(_){toast("Invalid JSON: needs shipments and couriers arrays")}}
 if(t.id==="rs"){db=JSON.parse($("#seed").textContent);save();render();toast("Sample data restored")}
};
$("#view").onchange=e=>{if(e.target.id==="flt"){filter=e.target.value;render()}if(e.target.classList.contains("st"))setStatus(e.target.dataset.id,e.target.value)};
$("#view").onkeydown=e=>{if(e.key==="Enter"&&e.target.id==="tid"){trackId=e.target.value.trim();render()}};
$("#fX").onclick=()=>$("#dlg").close();
$("#fOk").onclick=()=>{
 const v=i=>$("#"+i).value.trim();
 if(!v("fS")||!v("fR")||!v("fC")){toast("Fill in sender, receiver and city");return}
 const next=Math.max(1000,...db.shipments.map(s=>+s.id.split("-")[1]))+1,id="PCL-"+next;
 db.shipments.push({id,sender:v("fS"),receiver:v("fR"),city:v("fC"),courier:$("#fK").value,status:"Pending",created:today(),history:[["Pending",today()]]});
 save();$("#dlg").close();view="ship";filter="All";$("#q").value="";render();toast(id+" created")};
render();
</script>
</body>
</html>
